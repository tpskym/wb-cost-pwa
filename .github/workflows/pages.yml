name: Check and deploy PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  native-source:
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.native.outputs.run-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        id: native
        with:
          script: |
            const {execFileSync} = require('node:child_process');
            const files = ['macos-helper', 'scripts/prepare-macos-helper.mjs', 'tests/macos-helper.test.js'];
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'pages.yml', branch: 'main', status: 'success', per_page: 20
            });
            let reuse = '';
            for (const run of data.workflow_runs) {
              if (!/^[a-f0-9]{40}$/.test(run.head_sha)) continue;
              try { execFileSync('git', ['diff', '--quiet', run.head_sha, 'HEAD', '--', ...files]); }
              catch { continue; }
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: run.id});
              if (artifacts.data.artifacts.some(a => a.name === 'workshop-macos' && !a.expired)) {
                reuse = String(run.id);
                core.info('Reusing verified macOS component from successful run ' + reuse + ': native sources are identical.');
                break;
              }
            }
            core.setOutput('run-id', reuse);
  deploy:
    needs: [windows-helper, macos-helper, webdav-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Test application
        run: |
          set +e
          npm test 2>&1 | tee /tmp/workshop-tests.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then node scripts/report-test-failures.mjs /tmp/workshop-tests.log; fi
          exit "$result"
      - uses: actions/download-artifact@v4
        with:
          name: workshop-macos
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: workshop-webdav-*
          merge-multiple: true
          path: .
      - run: |
          mkdir public
          cp -R pdfjs public/
          cp workshop-webdav-*.zip webdav-client.js webdav-sync.js sync-merge.js sync-scheduler.js catalogue-resize.js print-action-controls.js backup-modes.js expenses.js workshop-macos.zip windows-opener.js workshop-windows.zip index.html app.js model-preview.js model-preview-runtime.js working-downloads.js google-drive-backup.js queue-stock-sync.js database-storage.js google-drive-setup.js product-images.js database-backup.js availability-filters.js sku-copy.js image-preview.js catalogue-status.js product-photo-picker.js group-label-picker.js cost-report.js print-completion.js label-thumbnail.js release-history.js marketplace-prices.js ozon-rich-text.js print-queue.js print-queue-state.js workspace-history.js product-labels.js data-freshness.js stock-additions.js warehouse-stocks.js listing-templates.js marketplace-orders.js remote-media.js sales.js finance.js filament-stock.js number-controls.js calc.js attachments.js full-backup.js marketplace-api.js marketplace-metrics.js marketplace-ui.js listing-fields.js ai-prompt.js listing-editor.js wb-prices.js price-editor.js category-catalog.js style.css sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment

  webdav-tests:
    strategy:
      matrix:
        include:
          - os: macos-15
            archive: workshop-webdav-macos
          - os: macos-15-intel
            archive: workshop-webdav-macos-intel
          - os: windows-latest
            archive: workshop-webdav-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/webdav-sync.test.js
      - run: python -m pip install -r webdav-helper/requirements.txt
      - run: python -m unittest discover -s webdav-helper
      - name: Test macOS Keychain and package component
        if: runner.os == 'macOS'
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          keychain="$RUNNER_TEMP/workshop-test.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          python webdav-helper/test_system_vault.py
          security delete-keychain "$keychain"
          python -m PyInstaller --noconfirm --windowed --onedir --name Workshop-WebDAV --osx-bundle-identifier io.github.tpskym.workshop.webdav webdav-helper/bridge.py
          ditto -c -k --sequesterRsrc --keepParent dist/Workshop-WebDAV.app "$ARCHIVE.zip"
      - name: Test Windows Credential Manager and package component
        if: runner.os == 'Windows'
        run: |
          python webdav-helper/test_system_vault.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --noconsole --onefile --name Workshop-WebDAV webdav-helper/bridge.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/Workshop-WebDAV.exe -DestinationPath workshop-webdav-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}.zip
          if-no-files-found: error

  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows component and file restrictions
        shell: powershell
        run: ./windows-helper/Test-WorkshopFile.ps1

  macos-helper:
    needs: native-source
    runs-on: ${{ needs.native-source.outputs.run-id != '' && 'ubuntu-latest' || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: needs.native-source.outputs.run-id != ''
        with:
          name: workshop-macos
          github-token: ${{ github.token }}
          run-id: ${{ needs.native-source.outputs.run-id }}
          path: .
      - if: needs.native-source.outputs.run-id == ''
        run: node --test tests/macos-helper.test.js
      - if: needs.native-source.outputs.run-id == ''
        run: node scripts/prepare-macos-helper.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-macos
          path: workshop-macos.zip
