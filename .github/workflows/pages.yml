name: Check and deploy PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    needs: [windows-helper, macos-helper]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Test application
        run: |
          set +e
          npm test 2>&1 | tee /tmp/workshop-tests.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then node scripts/report-test-failures.mjs /tmp/workshop-tests.log; fi
          exit "$result"
      - uses: actions/download-artifact@v4
        with:
          name: workshop-macos
          path: .
      - run: |
          mkdir public
          cp -R pdfjs public/
          cp catalogue-resize.js print-action-controls.js backup-modes.js expenses.js workshop-macos.zip windows-opener.js workshop-windows.zip index.html app.js model-preview.js model-preview-runtime.js working-downloads.js google-drive-backup.js queue-stock-sync.js database-storage.js google-drive-setup.js product-images.js database-backup.js availability-filters.js sku-copy.js image-preview.js catalogue-status.js product-photo-picker.js group-label-picker.js cost-report.js print-completion.js label-thumbnail.js release-history.js marketplace-prices.js ozon-rich-text.js print-queue.js print-queue-state.js workspace-history.js product-labels.js data-freshness.js stock-additions.js warehouse-stocks.js listing-templates.js marketplace-orders.js remote-media.js sales.js filament-stock.js number-controls.js calc.js attachments.js full-backup.js marketplace-api.js marketplace-metrics.js marketplace-ui.js listing-fields.js ai-prompt.js listing-editor.js wb-prices.js price-editor.js category-catalog.js style.css sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment

  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows component and file restrictions
        shell: powershell
        run: ./windows-helper/Test-WorkshopFile.ps1

  macos-helper:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/macos-helper.test.js
      - run: node scripts/prepare-macos-helper.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-macos
          path: workshop-macos.zip
